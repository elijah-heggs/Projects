<!DOCTYPE html>
<html lang="en">
     <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Big Muscles Fitness Application</title>
          <script src="client.js" defer></script>
     </head>
<body>

<h1> Big Muscles Fitness Application</h1>
<h3>By Elijah Heggs</h3>

<div id="loginUI">
    <h3>Login</h3>
    <form id="LoginForm">
      <label for="loginUsername">Username:</label>
      <input type="text" id="loginUsername" required>

      <br>

      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required>

      <br>

      <button type="button" id="joinBtn">Log In</button>
    </form>

    <div id="login-error" style="color:red;"></div>

    <p> Don't have an account? 
      <a href="#" id="showRegisterBtn"> Register Here </a>
    </p>
  </div>

<div id="registerUI">
  <h3>Sign up for a new account</h3>
  <form id="registerForm">
    <label for="registerUsername"> Username (5-15 characters): </label>

    <br>

    <input type="text" id="registerUsername"pattern="\w{5,15}" required>

    <br>

    <input type="password" id="registerPassword"  pattern="(?=.*[A-Za-z])(?=.*\d).{6,}" required >

    <br>

    <button type="button" id="registerBtn"> Register </button>
  </form>

  <div id="register-error" style="color:red;"></div>

  <p>
    Already have an account?
    <a href="#" id="showLoginBtn">
      Log in here
    </a>
  </p>

</div>

</body>
</html>
